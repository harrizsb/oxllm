# specs/product/SCOPE_LATEST.yaml — bounded PRD written by scope-work (spine step 1 of 3)
feature_name: "provider-model-ping"
core_value: >
  The operator can verify, on demand from the dashboard, that each configured
  provider+model actually answers a real request — closing the gap between
  "config parses" and "config works".
summary: >
  Config validation proves config.toml parses and cross-references resolve; it says
  nothing about whether a provider+model actually answers. A dead API key, a typo'd
  model name, or a wrong base_url all pass validation and only surface when a real
  user request fails. This initiative adds a dashboard Ping control on each provider
  row and each model row inside that provider. Clicking it sends one real minimal
  completion (max_tokens: 1) through the existing chat-completions request path,
  pinned to the clicked provider+model, and reports success or the upstream error.
  The ping has full parity with a normal request: provider counters, circuit-breaker
  feedback, the 3-entry request log, daily token accounting, and telemetry all update.
in_scope:
  - id: "S1"
    item: "POST /admin/ping relay endpoint: {provider, model} -> one real minimal completion via the shared chat-completions attempt path; JSON result with success/error, status, latency"
  - id: "S2"
    item: "Dashboard Ping buttons: one per provider row and one per model row inside that provider; inline result display"
  - id: "S3"
    item: "Shared attempt extraction: refactor create_chat_completions so the per-provider attempt is one function reused by the main route and the ping (no parallel implementation)"
  - id: "S4"
    item: "Tests: unit + integration (mock upstream) proving ping success, ping failure, full parity (counters, breaker, request log, tokens), and route guard"
  - id: "S5"
    item: "Gates: cargo fmt --check, clippy -D warnings, cargo test --workspace, release binary < 15 MB"
out_of_scope:
  - item: "CLI ping, ping-all-at-one-click"
    why: "User chose dashboard-only trigger"
  - item: "Browser-to-upstream direct calls"
    why: "CORS blocks most providers; oxllm relays the one request"
  - item: "Changes to existing routing, virtual-model resolution, or /v1 endpoints"
    why: "User: no additional feature; reuse existing functionality"
  - item: "Auth, rate limiting, multi-tenancy"
    why: "Tailnet is the trust boundary (Amendment A1)"
  - item: "Ping history or persistence"
    why: "In-memory only; the 3-entry request log already records pings"
constraints:
  - "CLAUDE.md gates: cargo fmt --check, cargo clippy --workspace --all-targets -- -D warnings, stripped release binary < 15 MB, reqwest rustls-tls, no .unwrap()/.expect() in user-facing paths, lock-free hot path preserved"
  - "The ping reuses the main chat-completions request path unchanged: no new request-building logic"
  - "Full parity: ping counts as a normal request (counters, breaker, request log, tokens, telemetry)"
  - "Dashboard stays include_str!-embedded static HTML with vanilla JS; no build step, no new dependencies"
  - "POST /admin/ping sits behind the tailnet guard and same-origin check like /config, /validate, /apply"
success_criteria:
  - "Clicking Ping on a provider/model row sends one real minimal completion to that provider+model and shows success (with latency) or the upstream error inline"
  - "A successful ping increments the provider request/success counters, records a request-log entry, and adds to daily token accounting — identical to a normal request"
  - "A failed ping feeds circuit-breaker failure feedback exactly like a normal failed request"
  - "cargo test --workspace green including new ping suites; cargo fmt --check and strict clippy clean; release binary still under 15 MB"
references:
  - "specs/planning-context.yaml — decision log from elaborate-spec"
  - "handoff.md — Amendment A1 rev 2 (tailnet-only trust boundary)"
  - "CLAUDE.md — repo engineering gates"
  - "specs/epics/e01-tailscale-gateway-editor/ — prior epic capsule (format reference)"
