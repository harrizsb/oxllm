# specs/planning-context.yaml — written by elaborate-spec; consumed by scope-work and slice-tasks
feature_name: "provider-model-ping"
problem_statement: >
  Config validation proves config.toml parses and cross-references resolve, but it cannot prove a
  provider+model actually answers. A dead API key, a typo'd model name, or a wrong base_url all pass
  validation and only surface when a real user request fails. The operator needs a way to verify each
  configured provider+model on demand, from the dashboard, before trusting the config.
constraints:
  - "Dashboard-only trigger: a Ping button on each provider row and each model row inside that provider (per-provider, per-model)"
  - "Real minimal paid completion request: max_tokens 1, tiny prompt, sent to the provider chat/completions endpoint; paid requests are acceptable"
  - "One relay endpoint POST /admin/ping {provider, model} behind the existing tailnet guard and same-origin check (browser cannot call upstreams directly: CORS)"
  - "The handler reuses the main chat-completions request path unchanged: no new request-building logic, no parallel implementation"
  - "Full parity: the ping counts as a normal request; provider counters, circuit-breaker feedback, 3-entry request log, daily token accounting, and telemetry all update"
  - "No changes to existing routing, virtual-model resolution, or /v1 endpoints"
out_of_scope:
  - "CLI ping, ping-all-at-once, browser-to-upstream direct calls"
  - "Changes to existing routing or virtual-model behavior"
  - "Auth, rate limiting, multi-tenancy (tailnet is the trust boundary)"
key_decisions:
  - decision: "Per-provider, per-model ping scope"
    rationale: "User chose to ping the exact provider+model selected; needed to test individual keys in the key-rotation setup (glm-a vs glm-b)"
  - decision: "Relay endpoint, not browser-direct"
    rationale: "Browser JS cannot reliably call upstream providers (CORS); oxllm relays the one ping request"
  - decision: "Reuse the main request path, pinned to the clicked pair"
    rationale: "User: just use existing functionality, let the ping route through the main function; no new request logic"
  - decision: "Full parity with a normal request"
    rationale: "User accepted side effects: counters, breaker feedback, request log, tokens all update; it is fine"
